<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Now and next on each stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#EB8100}a:hover{color:#FF9A1F}
</style>
</helmet>
<div style="width: 390px; height: 1480px; box-sizing: border-box; background: #10090C; color: #F5F5F5; font-family: Mulish, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<header style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #EB8100; font-weight: 700">All stages at one time</div>
<h1 style="margin: 0; font-weight: 700; font-size: 32px">Now &amp; next</h1>
</header>
<div role="group" aria-label="Day" style="padding: 16px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="3">
<div style="display: flex">
<sc-if value="{{ d.on }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="true" onClick="{{ d.pick }}" style="flex-grow: 1; height: 44px; border: 1px solid #F5F5F5; border-radius: 8px; background: #F5F5F5; color: #10090C; font-family: Mulish, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{ d.label }}</button>
</sc-if>
<sc-if value="{{ d.off }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="false" onClick="{{ d.pick }}" style="flex-grow: 1; height: 44px; border: 1px solid rgba(245, 245, 245, 0.25); border-radius: 8px; background: rgba(245, 245, 245, 0.07); color: #F5F5F5; font-family: Mulish, sans-serif; font-size: 14px; font-weight: 400; cursor: pointer">{{ d.label }}</button>
</sc-if>
</div>
</sc-for>
</div>
<div role="group" aria-label="Time" style="padding: 12px 20px 0; display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="30 minutes earlier" onClick="{{ earlier }}" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 1px solid rgba(245, 245, 245, 0.4); border-radius: 50%; background: transparent; color: #F5F5F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
</button>
<div aria-live="polite" style="flex-grow: 1; text-align: center; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums">{{ timeLabel }}</div>
<button type="button" aria-label="30 minutes later" onClick="{{ later }}" style="width: 44px; height: 44px; flex-shrink: 0; box-sizing: border-box; border: 1px solid rgba(245, 245, 245, 0.4); border-radius: 50%; background: transparent; color: #F5F5F5; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
<button type="button" onClick="{{ goNow }}" style="height: 44px; padding: 0 20px; border: 0; border-radius: 100px; background: linear-gradient(90deg, #8A3900, #EB8100); color: #F5F5F5; font-family: Mulish, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer">Now</button>
</div>
<div style="padding: 16px 20px 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ stages }}" as="g" hint-placeholder-count="7">
<section style="border-radius: 8px; background: rgba(245, 245, 245, 0.07); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: #EB8100">{{ g.stage }}</h2>
<sc-if value="{{ g.playing }}" hint-placeholder-val="{{ true }}">
<a href="Artist.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; text-decoration: none; color: #F5F5F5">
<sc-if value="{{ g.photo }}" hint-placeholder-val="{{ true }}">
<div role="img" aria-label="Artist photo" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 8px; background: #2A2326; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B0ADAE" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="9" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
</div>
</sc-if>
<sc-if value="{{ g.noPhoto }}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="width: 48px; height: 48px; flex-shrink: 0; box-sizing: border-box; border-radius: 8px; border: 1px solid rgba(245, 245, 245, 0.4); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">{{ g.initials }}</div>
</sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-size: 18px; font-weight: 700">{{ g.now }}</span>
<span style="flex-shrink: 0; font-size: 16px; font-weight: 700; color: #F5F5F5; font-variant-numeric: tabular-nums">{{ g.time }}</span>
</div>
<div style="height: 4px; border-radius: 2px; background: rgba(245, 245, 245, 0.25); display: flex" aria-hidden="true">
<div style="width: {{ g.pct }}; border-radius: 2px; background: linear-gradient(90deg, #8A3900, #EB8100)"></div>
</div>
<span style="font-size: 13px; color: rgba(245, 245, 245, 0.7)">{{ g.ends }}</span>
</div>
</a>
</sc-if>
<sc-if value="{{ g.idle }}" hint-placeholder-val="{{ false }}">
<div style="min-height: 48px; display: flex; align-items: center; font-size: 15px; color: rgba(245, 245, 245, 0.7)">No set at this time</div>
</sc-if>
<sc-if value="{{ g.hasNext }}" hint-placeholder-val="{{ true }}">
<a href="Artist.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid rgba(245, 245, 245, 0.12); text-decoration: none; color: #F5F5F5">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: rgba(245, 245, 245, 0.7)">NEXT</span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 700">{{ g.next }}</span>
<span style="font-size: 13px; font-weight: 700; color: #EB8100; font-variant-numeric: tabular-nums">{{ g.nextAt }}</span>
</a>
</sc-if>
<sc-if value="{{ g.noNext }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid rgba(245, 245, 245, 0.12)">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 2px; color: rgba(245, 245, 245, 0.7)">NEXT</span>
<span style="flex-grow: 1; font-size: 15px; color: rgba(245, 245, 245, 0.7)">No more sets on this stage today</span>
</div>
</sc-if>
</section>
</sc-for>
</div>
<nav aria-label="Main" style="margin-top: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid rgba(245, 245, 245, 0.12); background: #10090C; padding: 8px 12px 16px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: rgba(245, 245, 245, 0.7); font-size: 12px; font-weight: 400">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
<span>Line-up</span>
</a>
<a href="Now.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: #EB8100; font-size: 12px; font-weight: 700">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
<span>Now</span>
</a>
<a href="Explore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 52px; text-decoration: none; color: rgba(245, 245, 245, 0.7); font-size: 12px; font-weight: 400">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span>Explore</span>
</a>
</nav>
</div>
</x-dc>
